[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "threatscan"
version = "5.1.0"
description = "PolinRider / Contagious Interview detector, guard and remover for developer machines (Linux, macOS, Windows)"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [{ name = "Faheem Rafiq" }]
keywords = ["security", "malware", "polinrider", "lazarus", "supply-chain", "npm"]
classifiers = [
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Topic :: Security",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/FaheemRafiq/threatscan"
Issues = "https://github.com/FaheemRafiq/threatscan/issues"

[project.scripts]
threatscan = "threatscan.cli:main"

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.setuptools]
packages = ["threatscan", "threatscan.scanner"]

[tool.setuptools.package-data]
threatscan = ["iocs.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
