name: CI

on:
  push:
    branches: [main]
    paths-ignore: ["analysis/**", "**.md"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.8", "3.12"]
        exclude:
          - os: macos-latest
            python: "3.8"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest -q
      - name: Smoke-test CLI on this OS
        run: |
          threatscan --version
          threatscan scan --ci --no-report --no-system .
          threatscan install --dry-run --no-harden
          threatscan status
        shell: bash
